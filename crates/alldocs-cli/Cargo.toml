[package]
name = "alldocs-cli"
description = "Command-line converter from Office, OpenDocument, RTF, EPUB, CSV and PDF files to GitHub Flavored Markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "alldocs"
path = "src/main.rs"

[dependencies]
alldocs = { workspace = true, features = ["serde"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
serde_json = "1"
