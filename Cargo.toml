[workspace]
resolver = "3"
members = ["crates/alldocs", "crates/alldocs-cli", "bindings/node", "bindings/python"]
default-members = ["crates/alldocs", "crates/alldocs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
alldocs = { path = "crates/alldocs", version = "0.1.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
