[package]
name = "alldocs-python"
description = "Python bindings for alldocs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_alldocs"
crate-type = ["cdylib"]

[dependencies]
alldocs = { workspace = true }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
